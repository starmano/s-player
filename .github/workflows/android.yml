name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test and lint
        env:
          # Signs the release build with app/signing.p12 so it can update earlier installs.
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew assembleRelease testDebugUnitTest lintDebug

      - name: Test download site
        run: npm test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: s-player
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/

  # Every push to the default branch becomes a GitHub release named after its build number
  # (build-N, which is also the app's versionCode) with the APK attached as s-player.apk. The
  # download site and the app's update check both look at the latest release.
  release:
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: s-player

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv app-release.apk s-player.apk
          gh release create "build-${{ github.run_number }}" s-player.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "S Player build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}." \
            --latest
