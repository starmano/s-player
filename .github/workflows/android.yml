name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test and lint
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: s-player-debug
          path: app/build/outputs/apk/debug/*.apk

      # Everything that goes in the s-player.bmk.si folder: the download page plus the APK.
      - name: Assemble download site
        run: |
          mkdir -p build/site
          cp -r website/. build/site/
          cp app/build/outputs/apk/debug/app-debug.apk build/site/s-player.apk

      - name: Upload download site
        uses: actions/upload-artifact@v4
        with:
          name: s-player-website
          path: build/site/
          include-hidden-files: true

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
